name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'drcodecamp/reetroz'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$RENDER_API_KEY"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/srv-dangsrrtqb8s73bsnf80/deploys" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('id'), d.get('status'), d.get('trigger'))"
