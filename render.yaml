databases:
  - name: reetroz-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: frankfurt

services:
  - type: web
    name: reetroz-eu
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    rootDir: site
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: reetroz-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: NEXT_PUBLIC_ASSET_BASE
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_TELEGRAM_URL
        value: https://t.me/reetroz_official
      - key: NEXT_PUBLIC_DISCORD_URL
        value: https://discord.gg/g4SCXh5J8F
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false
