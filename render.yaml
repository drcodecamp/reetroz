databases:
  - name: reetroz-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: reetroz
    runtime: node
    plan: starter
    region: oregon
    rootDir: site
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: reetroz-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: NEXT_PUBLIC_ASSET_BASE
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
